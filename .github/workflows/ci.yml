name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'

jobs:
  lint:
    name: Linting & Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff linter
        run: ruff check app/ alembic/ scripts/

      - name: Run Ruff formatter check
        run: ruff format --check app/ alembic/ scripts/

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      # NOTE: These would be stored as GitHub Secrets:
      # - DATABASE_URL (PostgreSQL connection string)
      # - REDIS_URL (Redis connection string)
      # - GEMINI_API_KEY (Google Gemini API key)
      # - MINIO_ROOT_USER and MINIO_ROOT_PASSWORD (MinIO credentials)
      # - JWT_SECRET_KEY (JWT signing key)
      - name: Run pytest
        run: |
          pytest tests/ -v --tb=short
          echo "✓ All tests passed"

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: |
          cp .env.example .env
          export POSTGRES_USER=postgres
          export POSTGRES_PASSWORD=password
          export POSTGRES_DB=transcription_db
          export JWT_SECRET_KEY=ci-placeholder-secret
          export HUGGING_FACE_TOKEN=ci-placeholder-token
          export GEMINI_API_KEY=ci-placeholder-key
          docker compose config > /dev/null
          echo "✓ docker-compose.yml is valid"

      - name: Build FastAPI app image
        run: |
          docker build --target app -t video-transcription-app:test .
          echo "✓ FastAPI app image built successfully"

      - name: Build Celery worker image
        run: |
          docker build --target celery -t video-transcription-celery:test .
          echo "✓ Celery worker image built successfully"

      - name: Verify requirements.txt
        run: |
          if [ ! -f requirements.txt ]; then
            echo "❌ requirements.txt not found"
            exit 1
          fi
          echo "✓ requirements.txt exists"

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install security tools
        run: |
          pip install bandit safety

      - name: Run Bandit security scan
        run: |
          bandit -r app/ -f json -o bandit-report.json || true
          bandit -r app/ -ll

      - name: Run Safety vulnerability check
        run: |
          pip install -r requirements.txt
          safety check --json || true
          echo "Note: Safety checks for known vulnerabilities in dependencies"

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-security-report
          path: bandit-report.json