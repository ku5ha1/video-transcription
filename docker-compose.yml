version: '3.8'

services:
  # FastAPI Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ALGORITHM=HS256
      - JWT_EXPIRATION_DAYS=7
      - REDIS_URL=redis://redis:6379
      - MINIO_ENDPOINT=minio:9000
      - MINIO_EXTERNAL_ENDPOINT=localhost:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - QDRANT_URL=http://qdrant:6333
      - SHERPA_MODEL_DIR=/app/models/sherpa
      - WHISPER_MODEL_ID=deepdml/faster-whisper-large-v3-turbo-ct2
      - WHISPER_COMPUTE_TYPE=int8
      - WHISPER_MODEL_CACHE_DIR=/app/models/whisper
      - EMOTION_MODEL_CACHE_DIR=/app/models/emotion
      - TONE_MODEL_CACHE_DIR=/app/models/tone
      - HUGGING_FACE_TOKEN=${HUGGING_FACE_TOKEN}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - QDRANT_MODEL_CACHE=/app/models/qdrant
    depends_on:
      - postgres
      - redis
      - minio
      - qdrant
    volumes:
      - ./app:/app/app
      - shared_files:/tmp/shared
      - whisper_models:/app/models/whisper
      - emotion_models:/app/models/emotion
      - tone_models:/app/models/tone
      - ./sherpa-onnx:/app/models/sherpa
    networks:
      - transcription-network
    env_file:
      - .env

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - transcription-network

  # Redis Cache & Message Queue
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - transcription-network

  # Celery Worker
  celery:
    build:
      context: .
      dockerfile: Dockerfile
      target: celery
    command: celery -A app.core.celery worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ALGORITHM=HS256
      - JWT_EXPIRATION_DAYS=7
      - REDIS_URL=redis://redis:6379
      - MINIO_ENDPOINT=minio:9000
      - MINIO_EXTERNAL_ENDPOINT=localhost:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - SHERPA_MODEL_DIR=/app/models/sherpa
      - WHISPER_MODEL_ID=deepdml/faster-whisper-large-v3-turbo-ct2
      - WHISPER_COMPUTE_TYPE=int8
      - WHISPER_MODEL_CACHE_DIR=/app/models/whisper
      - EMOTION_MODEL_CACHE_DIR=/app/models/emotion
      - TONE_MODEL_CACHE_DIR=/app/models/tone
      - HUGGING_FACE_TOKEN=${HUGGING_FACE_TOKEN}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - QDRANT_MODEL_CACHE=/app/models/qdrant
    depends_on:
      - postgres
      - redis
      - minio
    volumes:
      - ./app:/app/app
      - shared_files:/tmp/shared
      - whisper_models:/app/models/whisper
      - emotion_models:/app/models/emotion
      - tone_models:/app/models/tone
      - ./sherpa-onnx:/app/models/sherpa
    networks:
      - transcription-network
    env_file:
      - .env

  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
      - MINIO_SERVER_URL=http://localhost:9000
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - transcription-network

  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - transcription-network

volumes:
  postgres_data:
  redis_data:
  minio_data:
  qdrant_data:
  shared_files:
  whisper_models:
  emotion_models:
  tone_models:

networks:
  transcription-network:
    driver: bridge